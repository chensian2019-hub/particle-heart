<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0a0711" />
  <meta name="description" content="一颗会跳动的颗粒爱心。" />
  <title>颗粒爱心</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; overflow: hidden; }
    body { background: #0a0711; color: #fff7f8; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 65% 42% at 50% 47%, #42152555, transparent 75%), radial-gradient(ellipse 70% 65% at 50% 100%, #1e1027aa, transparent 75%); }
    body::after { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .22; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E"); }
    main { position: relative; width: 100%; height: 100vh; height: 100dvh; min-height: 320px; isolation: isolate; }
    .scene { position: absolute; top: 0; right: 0; bottom: 0; left: 0; inset: 0; touch-action: manipulation; cursor: pointer; }
    canvas { display: block; width: 100%; height: 100%; }
    .halo { position: absolute; left: 50%; top: 50%; width: min(86vw, 480px); aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, #d3254a33 0, #c7204320 28%, transparent 68%); filter: blur(24px); pointer-events: none; animation: glow 2.4s ease-in-out infinite; }
    @keyframes glow { 50% { opacity: .65; transform: translate(-50%, -50%) scale(1.15); } }
    @media (prefers-reduced-motion: reduce) { .halo { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="scene" id="scene" role="button" tabindex="0" aria-label="轻触爱心，让颗粒绽放">
      <div class="halo"></div><canvas id="heart" aria-hidden="true"></canvas>
    </div>
  </main>
  <script>
    (() => {
      const scene = document.getElementById('scene');
      const canvas = document.getElementById('heart');
      const ctx = canvas.getContext('2d', { alpha: true });
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let w = 0, h = 0, cx = 0, cy = 0, scale = 0, particles = [], burstAt = -10000;
      const rand = (a, b) => a + Math.random() * (b - a);
      const inside = (x, y) => { const k = x*x + y*y - 1; return k*k*k - x*x*y*y*y <= 0; };
      function resize() {
        const box = scene.getBoundingClientRect();
        w = box.width; h = box.height;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
        canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cx = w / 2; cy = h * .50; scale = Math.min(w * .42, h * .30, 240);
        const count = Math.round(Math.min(4600, Math.max(3400, w * 10)));
        particles = [];
        while (particles.length < count) {
          const x = rand(-1.18, 1.18), y = rand(-1.12, 1.3);
          if (!inside(x, y)) continue;
          const depth = Math.random();
          particles.push({ x, y, depth, phase: rand(0, Math.PI * 2), size: rand(.85, 1.95), drift: rand(.2, 1), angle: Math.atan2(-y, x) });
        }
      }
      function draw(now) {
        ctx.clearRect(0, 0, w, h);
        const t = now * .001;
        const cycle = (t % 1.34) / 1.34;
        const beat = Math.exp(-Math.pow((cycle - .13) / .065, 2)) * .10 + Math.exp(-Math.pow((cycle - .29) / .06, 2)) * .055;
        const pulse = reduce ? 1 : 1 + beat + Math.sin(t * 2.1) * .006;
        const elapsed = (now - burstAt) / 1000;
        const burst = reduce ? 0 : Math.max(0, 1 - elapsed / 1.35);
        for (const p of particles) {
          const shimmer = reduce ? 0 : Math.sin(t * (1.1 + p.drift) + p.phase) * 1.8;
          const scatter = burst * burst * (18 + p.depth * 57);
          const px = cx + p.x * scale * pulse + Math.cos(p.angle) * scatter + Math.sin(t * .8 + p.phase) * p.drift * 1.5;
          const py = cy - p.y * scale * pulse + Math.sin(p.angle) * scatter + Math.cos(t * .65 + p.phase) * p.drift * 1.4;
          const light = 47 + p.depth * 29 + shimmer * 2;
          const alpha = .39 + p.depth * .57;
          ctx.beginPath(); ctx.arc(px, py, p.size * (.75 + p.depth * .62), 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${344 + p.depth * 12}, 100%, ${light}%, ${alpha})`;
          ctx.fill();
        }
        // A sparse constellation gives the heart a soft, living edge.
        if (!reduce) {
          ctx.globalCompositeOperation = 'lighter';
          for (let i = 0; i < 14; i++) {
            const p = particles[(i * 131) % particles.length];
            const r = 2.5 + Math.sin(t * 1.8 + p.phase) * 1.3;
            ctx.beginPath(); ctx.arc(cx + p.x * scale * pulse, cy - p.y * scale * pulse, r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 183, 204, .16)'; ctx.fill();
          }
          ctx.globalCompositeOperation = 'source-over';
          requestAnimationFrame(draw);
        }
      }
      function bloom() { burstAt = performance.now(); if (reduce) draw(burstAt); }
      scene.addEventListener('pointerdown', bloom);
      scene.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); bloom(); } });
      window.addEventListener('resize', () => { resize(); if (reduce) draw(performance.now()); });
      resize(); requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
